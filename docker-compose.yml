version: '3.8'

services:
  # ─── 1. POSTGRESQL DATABASE ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: reviewforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reviewforgedb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reviewforge_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. REDIS CACHE & RATE LIMITER ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: reviewforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reviewforge_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. BACKEND API ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewforge-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-reviewforgedb}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - app_data:/app/data
    networks:
      - reviewforge_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── 4. FRONTEND UI ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: reviewforge-frontend
    restart: unless-stopped
    environment:
      - API_URL=http://backend:8000
    networks:
      - reviewforge_net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8501/_stcore/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── 5. NGINX REVERSE PROXY ────────────────────────────────────────────────
  proxy:
    image: nginx:alpine
    container_name: reviewforge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - reviewforge_net
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  reviewforge_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_data:
