[project]
name = "reviewforge"
description = "ReviewForge is AI pair programming in your terminal"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Shikhar" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "litellm>=1.82",
    "openai>=2.0",
    "prompt_toolkit>=3.0",
    "rich>=14.0",
    "pygments>=2.0",
    "configargparse>=1.7",
    "shtab",
    "GitPython>=3.1",
    "grep-ast>=0.9",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.13",
    "beautifulsoup4>=4.14",
    "pypandoc",
    "requests",
    "httpx",
    "diff-match-patch",
    "watchfiles",
    "pyperclip",
    "pillow",
    "pathspec",
    "diskcache",
    "tqdm",
    "networkx",
    "posthog",
    "mixpanel",
    "pydub",
    "sounddevice",
    "soundfile",
    "python-dotenv",
    "importlib-resources",
    "oslex",
    "json5",
    "backoff",
    "packaging",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pinecone-client>=3.0",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "fastapi>=0.100",
    "uvicorn>=0.22",
]

[project.optional-dependencies]
browser = ["streamlit", "fastapi", "uvicorn"]
playwright = ["playwright"]
voice = ["sounddevice", "soundfile", "pydub"]
dev = ["pytest", "pytest-cov", "flake8"]

[project.urls]
Homepage = "https://github.com/Shikhar/reviewforge"

[project.scripts]
reviewforge = "reviewforge.main:main"

[tool.setuptools.packages.find]
include = ["reviewforge", "reviewforge.*"]

[tool.setuptools]
include-package-data = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
